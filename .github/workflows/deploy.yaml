name: Deploy infra

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Copy deploy script
        run: |
          scp \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            deploy.sh \
            ${{ secrets.USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.USER }}/web/infra/deploy.sh

      - name: Make script executable
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=no \
            ${{ secrets.USER }}@${{ secrets.SERVER_IP }} \
            "chmod +x /home/${{ secrets.USER }}/web/infra/deploy.sh"
