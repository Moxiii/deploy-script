name: Deploy infra

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: SECRET
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Copy deploy script
        run: |
          scp \
          -o StrictHostKeyChecking=no \
            deploys.sh \
            ${{ secrets.USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.USER }}/web/infra/deploys.sh

      - name: Make script executable
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.USER }}@${{ secrets.SERVER_IP }} \
            "chmod +x /home/${{ secrets.USER }}/web/infra/deploys.sh"
